name: Update Fruugo feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches:
      - main
    paths:
      - "fruugo_feed_builder.py"
      - "data/**"
      - ".github/workflows/update-fruugo-feed.yml"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Fruugo CSV
        env:
          SUPPLIER_FEED_URL: ${{ secrets.SUPPLIER_FEED_URL }}
        run: python fruugo_feed_builder.py --output docs/fruugo.csv

      - name: Validate 500-SKU output
        run: |
          python - <<'PY'
          import csv
          with open("docs/fruugo.csv", encoding="utf-8", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 500, f"Expected 500 SKUs, got {len(rows)}"
          assert sum(1 for r in rows if r["Category"].endswith("> Womens") and "Sunglasses" in r["Category"]) == 50
          assert sum(1 for r in rows if r["ProductId"].startswith("APW")) == 100
          assert sum(1 for r in rows if r["Attribute1"] == "1") == 50
          print("Validated: 500 SKUs, 50 sunglasses with CE Mark, 100 watches")
          PY

      - name: Publish updated feed
        run: |
          git config user.name "Avenida Prestige Feed"
          git config user.email "contact@avenidaprestige.com"
          git add docs/fruugo.csv
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "Update Fruugo feed"
            git push
          fi
