name: Prepare Kiorlay next 10-watch images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kiorlay-images-5.yml'

permissions:
  contents: write

jobs:
  prepare-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and requests
        run: pip install pillow requests

      - name: Download and resize real supplier images
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from io import BytesIO
          import requests

          products = {
              "NK0020-55E": [
                  "https://b2b.timeshop24.com/media/catalog/product/n/k/nk0020-55e.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/n/k/nk0020-55e_s.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/n/k/nk0020-55e_b.jpg",
              ],
              "98B445": [
                  "https://b2b.timeshop24.com/media/catalog/product/9/8/98b445.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/9/8/98b445_2.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/9/8/98b445_4.jpg",
              ],
              "241920": [
                  "https://b2b.timeshop24.com/media/catalog/product/2/4/241920.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/2/4/241920_front.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/2/4/241920_side.jpg",
              ],
              "84681": [
                  "https://b2b.timeshop24.com/media/catalog/product/z/e/zeppelin-herrenuhr-automatik-gmt-84681-002.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/z/e/zeppelin-herrenuhr-automatik-gmt-84681-mood-006.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/z/e/zeppelin-herrenuhr-automatik-gmt-84681-mood-008.jpg",
              ],
              "1513937": [
                  "https://b2b.timeshop24.com/media/catalog/product/1/5/1513937.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/1/5/1513937_side.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/1/5/1513937_back.jpg",
              ],
              "VEHC00519": [
                  "https://b2b.timeshop24.com/media/catalog/product/v/e/vehc00519.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/v/e/vehc00519__side.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/v/e/vehc00519_virtus_side.jpg",
              ],
              "R8823118015": [
                  "https://b2b.timeshop24.com/media/catalog/product/r/8/r8823118015.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/r/8/r8823118015_4.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/r/8/r8823118015_3.jpg",
              ],
              "GW0814L3": [
                  "https://b2b.timeshop24.com/media/catalog/product/g/w/gw0814l3.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/g/w/gw0814l3_q.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/g/w/gw0814l3_p.jpg",
              ],
              "SMWGI0004205": [
                  "https://b2b.timeshop24.com/media/catalog/product/s/m/smwgi0004205_01.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/s/m/smwgi0004205_02.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/s/m/smwgi0004205_03.jpg",
              ],
              "F20038-1": [
                  "https://b2b.timeshop24.com/media/catalog/product/f/2/f20038_1.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/f/2/f20038_1_3.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/f/2/f20038_1-_1_.jpg",
              ],
          }

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0"})

          def trim_white(img):
              img = img.convert("RGB")
              bg = Image.new("RGB", img.size, "white")
              diff = ImageChops.difference(img, bg).convert("L")
              bbox = diff.point(lambda p: 255 if p > 12 else 0).getbbox()
              return img.crop(bbox) if bbox else img

          for ref, urls in products.items():
              for i, url in enumerate(urls, 1):
                  r = session.get(url, timeout=60)
                  r.raise_for_status()
                  img = Image.open(BytesIO(r.content))
                  img = trim_white(img)

                  canvas = Image.new("RGB", (1200, 1200), "white")
                  img.thumbnail((900, 900), Image.Resampling.LANCZOS)
                  x = (1200 - img.width) // 2
                  y = (1200 - img.height) // 2
                  canvas.paste(img, (x, y))
                  canvas.save(f"{ref}_{i}.jpg", "JPEG", quality=94, optimize=True)
                  print(ref, i, url)
          PY

      - name: Commit resized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NK0020-55E_*.jpg 98B445_*.jpg 241920_*.jpg 84681_*.jpg 1513937_*.jpg VEHC00519_*.jpg R8823118015_*.jpg GW0814L3_*.jpg SMWGI0004205_*.jpg F20038-1_*.jpg
          git commit -m "Prepare next 10 Kiorlay watch images" || exit 0
          git push
