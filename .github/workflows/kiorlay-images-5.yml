name: Prepare Kiorlay 10-watch images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kiorlay-images-5.yml'

permissions:
  contents: write

jobs:
  prepare-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and requests
        run: pip install pillow requests

      - name: Download and resize real supplier images
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from io import BytesIO
          import requests

          products = {
              "AW1765-88X": [
                  "https://b2b.timeshop24.com/media/catalog/product/a/w/aw1765-88x.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/c/i/citizen_geh_use-schwarz_-ziffernblatt-orange_-armband-schwarz_aw1765-88x.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/c/i/citizen_geh_use-schwarz_-ziffernblatt-orange_-armband-schwarz_aw1765-88x_3.jpg",
              ],
              "BN0151-17L": [
                  "https://b2b.timeshop24.com/media/catalog/product/b/n/bn0151-17l_1.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/c/i/citizen_geh_use-silberfarben_-ziffernblatt-blau_-armband-blau_bn0151-17l_2.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/c/i/citizen_geh_use-silberfarben_-ziffernblatt-blau_-armband-blau_bn0151-17l_4.jpg",
              ],
              "96B441": [
                  "https://b2b.timeshop24.com/media/catalog/product/9/6/96b441.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/9/6/96b441_2.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/9/6/96b441_3.jpg",
              ],
              "241902": [
                  "https://b2b.timeshop24.com/media/catalog/product/2/4/241902_front.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/2/4/241902_front2.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/2/4/241902_side.jpg",
              ],
              "85363": [
                  "https://b2b.timeshop24.com/media/catalog/product/z/e/zeppelin-8536-3-herrenuhr-friedrichshafen-002.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/z/e/zeppelin-8536-3-herrenuhr-friedrichshafen-mood-002.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/z/e/zeppelin-8536-3-herrenuhr-friedrichshafen-mood-004.jpg",
              ],
              "SMWGC0000331": [
                  "https://b2b.timeshop24.com/media/catalog/product/s/m/smwgc0000331_01_ead4915e-3628-4834-8ac5-cceb0bef085b.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/s/m/smwgc0000331_02_6ead8bc4-2e1c-488e-b106-60afa74bf6b4.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/s/m/smwgc0000331_03_1a7e6c8b-d3c6-4d25-b5ab-819fcf34265f.jpg",
              ],
              "VEVH00520": [
                  "https://b2b.timeshop24.com/media/catalog/product/v/e/vevh00520.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/v/e/vevh00520_side.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/v/e/vevh00520_back.jpg",
              ],
              "1513915": [
                  "https://b2b.timeshop24.com/media/catalog/product/1/5/1513915.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/1/5/1513915_side.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/1/5/1513915_back.jpg",
              ],
              "R8873621007": [
                  "https://b2b.timeshop24.com/media/catalog/product/r/8/r8873621007_1.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/r/8/r8873621007_6.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/r/8/r8873621007_4.jpg",
              ],
              "GW0771L4": [
                  "https://b2b.timeshop24.com/media/catalog/product/g/w/gw0771l4.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/g/w/gw0771l4_q.jpg",
                  "https://b2b.timeshop24.com/media/catalog/product/g/w/gw0771l4_p.jpg",
              ],
          }

          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0"})

          def trim_white(img):
              img = img.convert("RGB")
              bg = Image.new("RGB", img.size, "white")
              diff = ImageChops.difference(img, bg).convert("L")
              bbox = diff.point(lambda p: 255 if p > 12 else 0).getbbox()
              return img.crop(bbox) if bbox else img

          for ref, urls in products.items():
              for i, url in enumerate(urls, 1):
                  r = session.get(url, timeout=60)
                  r.raise_for_status()
                  img = Image.open(BytesIO(r.content))
                  img = trim_white(img)

                  canvas = Image.new("RGB", (1200, 1200), "white")
                  img.thumbnail((900, 900), Image.Resampling.LANCZOS)
                  x = (1200 - img.width) // 2
                  y = (1200 - img.height) // 2
                  canvas.paste(img, (x, y))
                  canvas.save(f"{ref}_{i}.jpg", "JPEG", quality=94, optimize=True)
                  print(ref, i, url)
          PY

      - name: Commit resized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AW1765-88X_*.jpg BN0151-17L_*.jpg 96B441_*.jpg 241902_*.jpg 85363_*.jpg SMWGC0000331_*.jpg VEVH00520_*.jpg 1513915_*.jpg R8873621007_*.jpg GW0771L4_*.jpg
          git commit -m "Prepare Kiorlay 10 watch images" || exit 0
          git push
